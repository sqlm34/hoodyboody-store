<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>HOODYBOODY Chat</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="app-shell">
      <header class="app-header">
        <div>
          <p>Owner app</p>
          <h1>HOODYBOODY Chat</h1>
        </div>
        <button class="icon-button" id="settingsToggle" type="button" aria-label="Settings">⚙</button>
      </header>

      <section class="settings-card" id="settingsCard">
        <label>
          Site URL
          <input id="serverUrl" type="url" placeholder="https://www.hoodyboody.com" />
        </label>
        <label>
          Admin token
          <input id="adminToken" type="password" placeholder="CHAT_ADMIN_TOKEN" />
        </label>
        <button id="connectButton" type="button">Connect</button>
        <button id="notificationsButton" type="button">Enable notifications</button>
        <button id="testPushButton" type="button">Test push</button>
        <button id="soundSettingsButton" type="button">Choose notification sound</button>
        <p id="statusText">Enter token and connect.</p>
      </section>

      <section class="chat-layout">
        <aside class="conversation-list" id="conversationList"></aside>
        <section class="thread-card">
          <div class="thread-head" id="threadHead">
            <h2>Select chat</h2>
            <p>New customer messages will appear here.</p>
          </div>
          <div class="thread-messages" id="threadMessages"></div>
          <form class="reply-form" id="replyForm">
            <div class="reply-attachments" id="replyAttachments" hidden></div>
            <textarea id="replyText" rows="2" placeholder="Reply..."></textarea>
            <div class="reply-tools">
              <button class="attach-button" id="attachFileButton" type="button">Attach file</button>
              <input id="fileInput" type="file" multiple hidden />
              <button type="submit">Send</button>
            </div>
          </form>
        </section>
      </section>
    </main>

    <script src="app.js"></script>
  </body>
</html>
