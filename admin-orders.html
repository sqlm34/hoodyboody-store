<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow, noarchive" />
    <title>Orders | HOODYBOODY Owner</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <header class="topbar checkout-topbar" aria-label="Owner navigation">
      <a class="brand" href="/index.html" aria-label="HOODYBOODY">
        <span class="brand-mark">H</span>
        <span>HOODYBOODY</span>
      </a>
      <nav class="nav-links" aria-label="Sections">
        <a href="/index.html#catalog">Catalog</a>
        <a href="/admin.html">Owner</a>
        <a href="/admin-products.html">Product cards</a>
      </nav>
      <div class="top-actions">
        <a class="account-pill login-link" href="/auth.html" hidden>Login</a>
        <a class="account-pill cabinet-link" href="/account.html" hidden>Cabinet</a>
        <a class="account-pill admin-link" href="/admin.html" hidden>Owner</a>
        <button class="account-pill as-button logout-button" type="button" hidden>Logout</button>
      </div>
    </header>

    <main class="checkout-page admin-page">
      <section class="checkout-hero admin-hero" aria-labelledby="ordersTitle">
        <p class="eyebrow">owner dashboard</p>
        <h1 id="ordersTitle">Orders</h1>
        <p>Paid customer orders, Stripe totals, Shippo labels and tracking numbers.</p>
      </section>

      <section class="admin-locked checkout-panel" id="ordersLocked" hidden>
        <h2>Access denied</h2>
        <p id="ordersLockedText">This page is available only to the store owner.</p>
        <a class="button primary" href="/auth.html">Login as owner</a>
      </section>

      <section class="admin-dashboard admin-orders-dashboard" id="ordersDashboard" hidden>
        <div class="admin-orders-toolbar checkout-panel">
          <div>
            <h2>Paid orders</h2>
            <p id="ordersSummary">Loading orders...</p>
          </div>
          <button class="button ghost dark" id="ordersRefresh" type="button">
            <i class="fa-solid fa-rotate-right" aria-hidden="true"></i>
            <span>Refresh</span>
          </button>
        </div>

        <div class="admin-orders-list" id="ordersList" aria-live="polite"></div>
      </section>
    </main>

    <script src="/session-nav.js"></script>
    <script src="/admin-orders.js"></script>
  </body>
</html>
